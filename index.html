<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gold Portfolio Hub Enterprise - Egyptian Market & Wealth Intelligence</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="Gold Portfolio Hub Enterprise - Egyptian Market & Wealth Intelligence" />
    <meta name="description" content="Enterprise investment intelligence, portfolio management, and real-time market tracking for Egyptian Gold (24K, 21K, 18K), USD/EGP parallel rate, CBE interest rates, and multi-asset hedging with Gemini AI." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gold Portfolio Hub Enterprise" />
    <meta property="og:description" content="Enterprise multi-asset portfolio management and live Egyptian Gold & Exchange Rate analytics." />
    <meta property="og:theme-color" content="#0D1424" />

    <!-- Web App Manifest & Favicon -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body class="bg-[#0D1424] text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA ServiceWorker registered with scope:', reg.scope))
            .catch(err => console.warn('PWA ServiceWorker registration note:', err));
        });
      }
    </script>
  </body>
